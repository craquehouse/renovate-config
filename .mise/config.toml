# https://mise.jdx.dev/configuration.html

# rhysd/actionlint has not released since 1.7.12 (March 2026) and rejects newer
# runner labels such as ubuntu-26.04. kjanat/actionlint is a maintained,
# CLI-compatible fork. Aliasing keeps the tool name `actionlint`, so the
# home-operations workflow-lint action's `mise exec actionlint@<version>` runs
# the fork unchanged. Renovate ignores this alias; see .renovaterc.json5.
[tool_alias]
actionlint = "github:kjanat/actionlint"

[tools]
actionlint = "1.17.0"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
# @yarnpkg/libzip 3.2.2 was published manually rather than via the yarnbot CI
# pipeline, so it has no provenance attestation while 3.2.0/3.2.1 do. mise's
# no-downgrade trust policy reads that as a regression and blocks the entire
# renovate dependency tree. @yarnpkg/core pins ^3.2.2, so no renovate version
# resolves around it. Remove once upstream ships an attested release. See #11.

"npm:renovate" = { version = "44.194.0", trust_policy_excludes = [
  "@yarnpkg/libzip",
] }
shellcheck = "0.11.0"
zizmor = "1.31.1"

[tasks.gen]
description = "Regenerate default.json from the preset directories"
run = "node scripts/gen-default.mjs"

[tasks."lint"]
description = "Check JSON/JSON5, YAML, Markdown, and shell formatting"
run = [
  "oxfmt --check .",
  "git ls-files -co --exclude-standard '*.sh' | xargs -r shellcheck",
]

[tasks.validate]
description = "Validate Renovate presets against the schema"
run = "renovate-config-validator --strict"

[hooks]
postinstall = "lefthook install"
